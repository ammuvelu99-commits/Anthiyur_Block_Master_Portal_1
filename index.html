<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anthiyur Block Master Portal - Login Portal</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* ==================== THEMES (iOS 26 Inspired) ==================== */
        :root {
            --bg-main: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #064e3b 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }

        [data-theme="dark"] {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        [data-theme="light"] {
            --bg-main: #f0fdf4;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #475569;
        }

        body { 
            background: var(--bg-main); 
            background-attachment: fixed;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; min-height: 100vh;
            transition: all 0.5s ease;
            overflow-x: hidden;
        }

        /* LIQUID GLASS UI (Glassmorphism) */
        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        [data-theme="light"] .glass-panel {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .glass-btn {
            background: linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        [data-theme="light"] .glass-btn { background: #ffffff; }

        .glass-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }
        
        [data-theme="light"] .glass-btn:hover { box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: #f8fafc;}
        .glass-btn:active { transform: translateY(2px) scale(0.98); }

        .icon-wrapper {
            width: 60px; height: 60px;
            border-radius: 16px;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px; color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        /* BIG LANDSCAPE SLIDER (5 Seconds Auto Scroll) */
        .carousel-container { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16 / 9; /* Landscape Ratio */
            max-height: 550px; 
            overflow: hidden; 
            border-radius: 20px; 
            background: #000; /* Black background for un-filled edges */
        }
        
        .carousel-track { 
            display: flex; 
            height: 100%; 
            width: 100%;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); /* Smooth Slide Animation */
        }
        
        .carousel-slide { 
            min-width: 100%; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        
        .carousel-slide img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; /* Ensures the whole image is visible clearly without cropping */
        }

        /* INPUT FIELDS */
        .glass-input { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 12px 12px 45px; color: var(--text-main); outline: none; transition: all 0.3s; }
        .glass-input:focus { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
        [data-theme="light"] .glass-input { background: #f1f5f9; }

        /* React Modal Animation */
        @keyframes modalZoomIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal-animate { animation: modalZoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body>

    <!-- Header / Theme Switcher -->
    <header class="glass-panel mx-4 mt-4 py-3 px-6 flex justify-between items-center z-50 sticky top-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-tr from-teal-500 to-emerald-600 rounded-xl flex justify-center items-center shadow-lg border border-white/20">
                <i class="fas fa-hospital text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg md:text-xl font-black tracking-wide drop-shadow-md">Anthiyur Block Portal</h1>
                <p class="text-[10px] text-teal-400 font-bold tracking-widest uppercase">Health Department</p>
            </div>
        </div>
        <div class="flex gap-2 bg-black/20 p-1.5 rounded-xl border border-white/10">
            <button onclick="setTheme('light')" class="w-8 h-8 rounded-lg flex items-center justify-center text-amber-400 hover:bg-white/10 transition" title="Light Mode"><i class="fas fa-sun"></i></button>
            <button onclick="setTheme('dark')" class="w-8 h-8 rounded-lg flex items-center justify-center text-indigo-400 hover:bg-white/10 transition" title="Dark Mode"><i class="fas fa-moon"></i></button>
            <button onclick="setTheme('glass')" class="w-8 h-8 rounded-lg flex items-center justify-center text-pink-400 bg-white/10 shadow border border-white/20 transition" title="Liquid Glass" id="glassBtn"><i class="fas fa-droplet"></i></button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-8 pb-20">
        
        <!-- 1. IMAGE CAROUSEL (5 Seconds Auto Scroll) -->
        <div class="glass-panel p-2 mb-10 shadow-2xl">
            <div class="carousel-container relative">
                <div class="carousel-track" id="imageTrack">
                    <!-- உங்களின் 10 ஒரிஜினல் புகைப்படங்கள் மட்டுமே இணைக்கப்பட்டுள்ளன -->
                    <div class="carousel-slide"><img src="WhatsApp Image 2026-04-28 at 11.28.21 AM(1).jpg" alt="Medical Camp 1"></div>
                    <div class="carousel-slide"><img src="WhatsApp Image 2026-09-14 at 5.37.13 PM.jpeg" alt="Medical Camp 2"></div>
                    <div class="carousel-slide"><img src="WhatsApp Image 2026-09-14 at 5.35.56 PM.jpeg" alt="Medical Camp 3"></div>
                    <div class="carousel-slide"><img src="WhatsApp Image 2026-09-14 at 5.36.19 PM.jpg" alt="Medical Camp 4"></div>
                    <!-- HEIC படங்களை JPG ஆக மாற்றி சேவ் செய்யவும் -->
                    <div class="carousel-slide"><img src="IMG_3353.jpg" alt="Medical Camp 5"></div>
                    <div class="carousel-slide"><img src="IMG_3335.jpg" alt="Medical Camp 6"></div> 
                    <div class="carousel-slide"><img src="WhatsApp Image 2026-09-14 at 5.41.29 PM.jpeg" alt="Medical Camp 7"></div>
                    <div class="carousel-slide"><img src="WhatsApp Image 2026-09-14 at 5.41.27 PM.jpeg" alt="Medical Camp 8"></div>
                    <div class="carousel-slide"><img src="WhatsApp Image 2026-09-14 at 5.41.24 PM.jpeg" alt="Medical Camp 9"></div>
                    <div class="carousel-slide"><img src="WhatsApp Image 2026-09-14 at 5.41.21 PM.jpeg" alt="Medical Camp 10"></div>
                </div>
            </div>
        </div>

        <!-- 2. LOGIN BUTTONS -->
        <h2 class="text-2xl font-black mb-6 pl-2 border-l-4 border-teal-500"><i class="fas fa-sign-in-alt text-teal-400 mr-2"></i>Secure Login Portals</h2>
        
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 lg:gap-6">
            
            <!-- BMO BUTTON (Opens direct link in new tab) -->
            <div onclick="window.open('bmo_dashboard.html', '_blank')" class="glass-btn flex flex-col items-center justify-center p-6 lg:p-8 border-indigo-500/30 group">
                <div class="icon-wrapper mb-4" style="background: linear-gradient(135deg, #6366f1, #4338ca);"><i class="fas fa-user-shield group-hover:scale-110 transition"></i></div>
                <h3 class="font-black text-sm lg:text-base">BMO Login</h3>
                <p class="text-[10px] var(--text-muted) mt-1">Direct Access</p>
            </div>

            <!-- MO BUTTON (Triggers React Modal) -->
            <div onclick="triggerReactLogin('MO')" class="glass-btn flex flex-col items-center justify-center p-6 lg:p-8 border-emerald-500/30 group">
                <div class="icon-wrapper mb-4" style="background: linear-gradient(135deg, #10b981, #047857);"><i class="fas fa-user-doctor group-hover:scale-110 transition"></i></div>
                <h3 class="font-black text-sm lg:text-base">MO Login</h3>
                <p class="text-[10px] var(--text-muted) mt-1">PHC Wise Auth</p>
            </div>

            <!-- NCD BUTTON -->
            <div onclick="triggerReactLogin('NCD')" class="glass-btn flex flex-col items-center justify-center p-6 lg:p-8 border-blue-500/30 group">
                <div class="icon-wrapper mb-4" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8);"><i class="fas fa-heartbeat group-hover:scale-110 transition"></i></div>
                <h3 class="font-black text-sm lg:text-base">NCD Login</h3>
                <p class="text-[10px] var(--text-muted) mt-1">PHC Wise Auth</p>
            </div>

            <!-- VHN BUTTON -->
            <div onclick="triggerReactLogin('VHN')" class="glass-btn flex flex-col items-center justify-center p-6 lg:p-8 border-pink-500/30 group">
                <div class="icon-wrapper mb-4" style="background: linear-gradient(135deg, #ec4899, #be185d);"><i class="fas fa-user-nurse group-hover:scale-110 transition"></i></div>
                <h3 class="font-black text-sm lg:text-base">VHN Login</h3>
                <p class="text-[10px] var(--text-muted) mt-1">HSC Wise Auth</p>
            </div>

            <!-- SHN BUTTON -->
            <div onclick="triggerReactLogin('SHN')" class="glass-btn flex flex-col items-center justify-center p-6 lg:p-8 border-purple-500/30 group">
                <div class="icon-wrapper mb-4" style="background: linear-gradient(135deg, #a855f7, #7e22ce);"><i class="fas fa-user-md group-hover:scale-110 transition"></i></div>
                <h3 class="font-black text-sm lg:text-base">SHN Login</h3>
                <p class="text-[10px] var(--text-muted) mt-1">Sector Auth</p>
            </div>

            <!-- CHN BUTTON -->
            <div onclick="triggerReactLogin('CHN')" class="glass-btn flex flex-col items-center justify-center p-6 lg:p-8 border-orange-500/30 group">
                <div class="icon-wrapper mb-4" style="background: linear-gradient(135deg, #f97316, #c2410c);"><i class="fas fa-clinic-medical group-hover:scale-110 transition"></i></div>
                <h3 class="font-black text-sm lg:text-base">CHN Login</h3>
                <p class="text-[10px] var(--text-muted) mt-1">Block Auth</p>
            </div>

        </div>
    </main>

    <!-- Vanilla JS Logic for Theme & Carousel -->
    <script>
        // --- 1. Theme Controller ---
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('anthiyur_theme', theme);
            
            // UI Button Highlight logic
            document.querySelectorAll('header button').forEach(b => {
                b.classList.remove('bg-white/10', 'shadow', 'border');
            });
            event.currentTarget.classList.add('bg-white/10', 'shadow', 'border');
        }
        
        // Load saved theme on load
        window.onload = () => {
            const saved = localStorage.getItem('anthiyur_theme') || 'glass';
            document.documentElement.setAttribute('data-theme', saved);
        }

        // --- 2. Auto Image Carousel (5 Seconds) ---
        const track = document.getElementById('imageTrack');
        const slides = document.querySelectorAll('.carousel-slide');
        let currentIndex = 0;

        function scrollCarousel() {
            currentIndex++;
            if (currentIndex >= slides.length) {
                currentIndex = 0; // Reset to first image smoothly
            }
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
        }
        
        // 5000ms = 5 Seconds
        setInterval(scrollCarousel, 5000);

        // --- 3. Function to trigger React Modal ---
        function triggerReactLogin(roleName) {
            window.dispatchEvent(new CustomEvent('openReactLogin', { detail: roleName }));
        }
    </script>

    <!-- ==================== REACT LOGIN SYSTEM ==================== -->
    <div id="react-auth-root"></div>

    <script type="text/babel">
        function RoleLoginSystem() {
            const [isOpen, setIsOpen] = React.useState(false);
            const [role, setRole] = React.useState('');
            const [name, setName] = React.useState('');
            const [mobile, setMobile] = React.useState('');
            const [phc, setPhc] = React.useState('');

            React.useEffect(() => {
                const openLogin = (e) => { 
                    setRole(e.detail);
                    setIsOpen(true);
                };
                window.addEventListener('openReactLogin', openLogin);
                return () => window.removeEventListener('openReactLogin', openLogin);
            }, []);

            const handleLoginSubmit = () => {
                if(!name || !mobile) { alert("Please enter both Name and Mobile Number"); return; }
                if(!phc) { alert("Please select your PHC to proceed"); return; }

                // Session-ல் டேட்டாவை சேமிப்பது
                sessionStorage.setItem('activeRole', role);
                sessionStorage.setItem('activePhc', phc);
                sessionStorage.setItem('activeUserName', name);

                setIsOpen(false);

                // லாகின் செய்தவுடன் புதிய டேபில் (New Tab) அந்தந்த Dashboard-ஐ திறப்பது
                let targetUrl = '';
                if(role === 'MO') {
                    targetUrl = `mo_dashboard.html?phc=${encodeURIComponent(phc)}`;
                } else if(role === 'NCD') {
                    targetUrl = `ncd_dashboard.html?phc=${encodeURIComponent(phc)}`;
                } else if(role === 'VHN') {
                    targetUrl = `vhn_dashboard.html?phc=${encodeURIComponent(phc)}`;
                } else if(role === 'SHN') {
                    targetUrl = `shn_dashboard.html?phc=${encodeURIComponent(phc)}`;
                } else if(role === 'CHN') {
                    targetUrl = `chn_dashboard.html?phc=${encodeURIComponent(phc)}`;
                }

                // புதிய டேபில் திறக்கும் கோடு
                if(targetUrl) {
                    window.open(targetUrl, '_blank');
                }
                
                // Form Reset
                setName(''); setMobile(''); setPhc('');
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-md z-[10000] flex justify-center items-center p-4 transition-opacity">
                    <div className="glass-panel w-full max-w-md overflow-hidden modal-animate border border-white/20">
                        <div className="bg-gradient-to-r from-teal-600 to-emerald-800 p-4 flex justify-between items-center text-white">
                            <h3 className="text-lg font-bold"><i className="fas fa-fingerprint mr-2"></i> {role} Secure Authentication</h3>
                            <button onClick={() => setIsOpen(false)} className="text-white/80 hover:text-white text-2xl drop-shadow-md">&times;</button>
                        </div>
                        
                        <div className="p-6 space-y-5">
                            <div className="relative">
                                <i className="fas fa-user absolute left-4 top-3.5 text-slate-400"></i>
                                <input type="text" className="glass-input" placeholder="Enter Full Name" value={name} onChange={e => setName(e.target.value)} />
                            </div>
                            
                            <div className="relative">
                                <i className="fas fa-phone absolute left-4 top-3.5 text-slate-400"></i>
                                <input type="number" className="glass-input" placeholder="Registered Mobile Number" value={mobile} onChange={e => setMobile(e.target.value)} />
                            </div>
                            
                            {(role !== 'BMO' && role !== 'DEO') && (
                                <div className="relative">
                                    <i className="fas fa-hospital absolute left-4 top-3.5 text-slate-400"></i>
                                    <select className="glass-input appearance-none" value={phc} onChange={e => setPhc(e.target.value)}>
                                        <option value="" disabled>Select Your PHC / HSC</option>
                                        <option value="ATHANI">ATHANI</option>
                                        <option value="BARGUR">BARGUR</option>
                                        <option value="CT PALAYAM">CT PALAYAM</option>
                                        <option value="ENNAMANGALAM">ENNAMANGALAM</option>
                                        <option value="OSUR">OSUR</option>
                                    </select>
                                    <i className="fas fa-chevron-down absolute right-4 top-4 text-slate-400 pointer-events-none"></i>
                                </div>
                            )}

                            <div className="flex gap-3 pt-4 border-t border-white/10">
                                <button onClick={() => setIsOpen(false)} className="w-1/3 py-3 bg-white/10 hover:bg-white/20 border border-white/20 transition text-white rounded-xl text-sm font-bold">Cancel</button>
                                <button onClick={handleLoginSubmit} className="w-2/3 py-3 bg-gradient-to-r from-teal-500 to-emerald-600 hover:scale-[1.02] transition text-white rounded-xl text-sm font-bold shadow-lg shadow-teal-500/30">Authenticate <i className="fas fa-arrow-right ml-2"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('react-auth-root'));
        root.render(<RoleLoginSystem />);
    </script>
</body>
</html>
