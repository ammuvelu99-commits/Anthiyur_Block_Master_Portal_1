<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MO Dashboard</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #090d16 0%, #17153b 50%, #290835 100%); color: #f8fafc; font-family: sans-serif; min-height: 100vh; }
        .macos-header { background: rgba(15, 23, 42, 0.85); border-bottom: 1px solid rgba(255, 255, 255, 0.12); position: sticky; top: 0; z-index: 50; }
        .macos-card { background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03)); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.2); border-bottom: 4px solid rgba(255, 255, 255, 0.15); display: flex; align-items: center; padding: 12px 16px; cursor: pointer; transition: all 0.2s; }
        .macos-card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.15); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .icon-box { width: 45px; height: 45px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 20px; margin-right: 12px; color: white; border: 1px solid rgba(255,255,255,0.2); }
        
        #sheetOverlay { position: fixed; inset: 0; background: #0f172a; z-index: 9999; display: flex; transform: translateY(100%); transition: transform 0.4s ease; }
        #sheetOverlay.active { transform: translateY(0); }
        .iframe-container { width: 100%; height: 100%; background: #fff; }
        .btn-back { position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; background: rgba(244, 63, 94, 0.9); color: white; border-radius: 30px; cursor: pointer; font-weight: bold; border: 1px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 10000; }
    </style>
</head>
<body>
    <header class="macos-header py-4 px-4 shadow-xl">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gradient-to-tr from-emerald-500 to-teal-600 rounded-xl flex justify-center items-center shadow-lg border border-white/20">
                    <i class="fas fa-user-doctor text-white text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-white">MO Dashboard</h1>
                    <p class="text-emerald-300 font-bold text-sm tracking-wider uppercase" id="displayPhcName">Loading PHC...</p>
                </div>
            </div>
            <button onclick="window.close()" class="bg-red-500/20 text-red-400 px-4 py-2 rounded-lg font-bold hover:bg-red-500/40 border border-red-500/30 transition">
                <i class="fas fa-sign-out-alt mr-2"></i>Close Tab
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-8">
        <h2 class="text-white text-lg font-bold mb-4 border-b border-white/10 pb-2">Medical Officer Reports</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            
            <div onclick="openPhcReport('mtm')" class="macos-card border-blue-500/30">
                <div class="icon-box" style="background: linear-gradient(135deg, #3b82f6, #2563eb);"><i class="fas fa-heartbeat"></i></div>
                <div><h3 class="font-bold text-blue-300">MTM Report</h3><p class="text-xs text-slate-300">Your PHC HT & DM Tracking</p></div>
            </div>
            
            <div onclick="openPhcReport('cancer')" class="macos-card border-pink-500/30">
                <div class="icon-box" style="background: linear-gradient(135deg, #ec4899, #db2777);"><i class="fas fa-ribbon"></i></div>
                <div><h3 class="font-bold text-pink-300">MTM Cancer</h3><p class="text-xs text-slate-300">Your PHC Screening Data</p></div>
            </div>
            
            <div onclick="openPhcReport('delivery')" class="macos-card border-cyan-500/30">
                <div class="icon-box" style="background: linear-gradient(135deg, #06b6d4, #0891b2);"><i class="fas fa-baby"></i></div>
                <div><h3 class="font-bold text-cyan-300">Delivery Report</h3><p class="text-xs text-slate-300">Your PHC Line List</p></div>
            </div>

            <div onclick="alert('UWIN Reports linking soon!')" class="macos-card border-sky-500/30">
                <div class="icon-box" style="background: linear-gradient(135deg, #0ea5e9, #0284c7);"><i class="fas fa-shield-virus"></i></div>
                <div><h3 class="font-bold text-sky-300">UWIN Reports</h3><p class="text-xs text-slate-300">Vaccination Data</p></div>
            </div>
            
        </div>
    </main>

    <!-- FULL SCREEN SHEET OVERLAY -->
    <div id="sheetOverlay">
        <div class="iframe-container"><iframe id="sheetIframe" src="" style="width:100%; height:100%; border:none;"></iframe></div>
        <button onclick="closeSheet()" class="btn-back"><i class="fas fa-times mr-2"></i>Close Report</button>
    </div>

    <script>
        // 1. URL-ல் இருந்து PHC பெயரை எடுப்பது
        const urlParams = new URLSearchParams(window.location.search);
        const activePhc = urlParams.get('phc') || sessionStorage.getItem('activePhc') || 'UNKNOWN';
        document.getElementById('displayPhcName').innerText = "PHC: " + activePhc;

        // 2. MTM, Cancer-க்கான Google Sheet IDs (நீங்கள் தந்தவை)
        const BASE_PHC_MTM = "2PACX-1vRBCLoWLEYDoI9TeKuQmAbUhpCvsvQpE4gvMscWvhFNoUvxkf2E8psdNu81p0rMYt9enslTtGR5qmwU";
        
        const sheetConfigs = {
            'mtm_ATHANI': '1269216467', 'cancer_ATHANI': '1908373348', 'delivery_ATHANI': '', 
            'mtm_CT PALAYAM': '1514498450', 'cancer_CT PALAYAM': '1512167249', 'delivery_CT PALAYAM': '',
            'mtm_ENNAMANGALAM': '195628092', 'cancer_ENNAMANGALAM': '38799169',
            'mtm_BARGUR': '1551936318', 'cancer_BARGUR': '633378564',
            'mtm_OSUR': '707736315', 'cancer_OSUR': '656858698'
        };

        // 3. குறிப்பிட்ட PHC-க்கு உரிய Sheet-ஐ மட்டும் ஓபன் செய்வது
        function openPhcReport(reportType) {
            let configKey = reportType + '_' + activePhc.trim();
            let gid = sheetConfigs[configKey];
            
            if(gid) {
                let url = `https://docs.google.com/spreadsheets/d/e/${BASE_PHC_MTM}/pubhtml?gid=${gid}&single=true&widget=false&headers=false&chrome=false`;
                document.getElementById('sheetIframe').src = url;
                document.getElementById('sheetOverlay').classList.add('active');
            } else {
                alert(reportType + " data sheet is not linked for " + activePhc + " yet. Please provide the Sheet GID.");
            }
        }

        function closeSheet() {
            document.getElementById('sheetOverlay').classList.remove('active');
            setTimeout(() => { document.getElementById('sheetIframe').src = ""; }, 400);
        }
    </script>
</body>
</html>
